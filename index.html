<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Neon Snake</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="neon-text">SNAKE</h1>
            <div class="scores">
                <div class="score-box">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-box">
                    <span class="label">HI-SCORE</span>
                    <span id="highScore" class="value">0</span>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="overlay" class="overlay">
                <h2 id="overlayTitle" class="neon-text">READY?</h2>
                <button id="startBtn" class="neon-button">START GAME</button>
            </div>
        </div>

        <div class="controls-hint">
            <p class="desktop-hint">Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move</p>
            <p class="mobile-hint"><strong>Swipe</strong> to move</p>
        </div>
        
        <!-- Mobile D-pad controls -->
        <div class="d-pad">
            <button class="d-btn up" id="btnUp">▲</button>
            <div class="d-pad-middle">
                <button class="d-btn left" id="btnLeft">◀</button>
                <button class="d-btn right" id="btnRight">▶</button>
            </div>
            <button class="d-btn down" id="btnDown">▼</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
