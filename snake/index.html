<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 贪吃蛇</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title">贪吃蛇</div>
        <div class="scoreboard">
          <div class="score-item">
            <span class="label">分数</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="score-item">
            <span class="label">状态</span>
            <span id="status" class="value">未开始</span>
          </div>
        </div>
      </header>

      <section class="stage">
        <canvas id="game" width="480" height="480"></canvas>
      </section>

      <footer class="controls">
        <button id="btnStart" class="btn primary" type="button">开始</button>
        <button id="btnPause" class="btn" type="button" disabled>暂停</button>
        <button id="btnRestart" class="btn" type="button">重开</button>
      </footer>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
