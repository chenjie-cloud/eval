<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cyberpunk Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="scoreboard">
            <div class="score-box">
                <span class="label">SCORE</span>
                <span class="value" id="score">0000</span>
            </div>
            <div class="score-box">
                <span class="label">HI-SCORE</span>
                <span class="value" id="hi-score">9999</span>
            </div>
            <div class="score-box">
                <span class="label">LEVEL</span>
                <span class="value" id="level">1</span>
            </div>
        </header>

        <main class="game-wrapper">
            <div class="game-container" id="game-container">
                <canvas id="game-canvas"></canvas>
                <div class="scanlines"></div>
                <div class="overlay">
                    <h1 class="glitch" data-text="READY">READY</h1>
                    <p class="blink">PRESS START</p>
                </div>
            </div>
        </main>
        
        <footer class="controls-hint">
            <p>USE <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> TO MOVE</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
